name: Build and Deploy OpenIM Server

on:
  push:
    branches: [ develop_build, main ]
  pull_request:
    branches: [ develop_build, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-,format=short
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Notify Discord - Build Success
      if: success()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"🚀 OpenIM Server - 构建成功\",
              \"description\": \"Docker 镜像构建并推送完成\",
              \"color\": 3066993,
              \"fields\": [
                {
                  \"name\": \"分支\",
                  \"value\": \"\`${{ github.ref_name }}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"提交\",
                  \"value\": \"\`${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"镜像\",
                  \"value\": \"\`ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"构建者\",
                  \"value\": \"${{ github.actor }}\",
                  \"inline\": true
                }
              ]
            }]
          }"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop_build'

    steps:

    - name: Deploy via Portainer API
      if: github.ref == 'refs/heads/develop_build'
      run: |
        # 设置变量
        PORTAINER_URL="https://docker.guguim.app"
        PORTAINER_TOKEN="ptr_oVGV9nWLRCFDf2I3OTOSu+AqC7oZwgvbvQd7OD+8VpQ="
        CONTAINER_NAME="openim-server"
        COMMIT_HASH="${{ github.sha }}"
        BRANCH_NAME="${{ github.ref_name }}"
        GITHUB_IMAGE="ghcr.io/${{ github.repository }}:${BRANCH_NAME}-${COMMIT_HASH:0:7}"
        DISCORD_WEBHOOK_URL="https://discord.com/api/webhooks/1410921882714116227/M4NJjctluETrJk5JnWwW8U0uWCcgO_MYSCy-w8QefRI56zmMkY3Ii5C47MegO4A_1Vjm"
        
        echo "=== Portainer API 部署 ==="
        echo "Portainer URL: $PORTAINER_URL"
        echo "容器名称: $CONTAINER_NAME"
        echo "新镜像: $GITHUB_IMAGE"
        
        # 1. 获取环境列表
        echo "=== 获取环境信息 ==="
        ENVIRONMENTS=$(curl -s \
          -H "X-API-Key: $PORTAINER_TOKEN" \
          "$PORTAINER_URL/api/endpoints")
        
        ENDPOINT_ID=$(echo "$ENVIRONMENTS" | jq -r '.[0].Id')
        echo "使用环境 ID: $ENDPOINT_ID"
        
        # 2. 查找现有容器
        echo "=== 查找现有容器 ==="
        CONTAINERS=$(curl -s \
          -H "X-API-Key: $PORTAINER_TOKEN" \
          "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/containers/json?all=true")
        
        CONTAINER_ID=$(echo "$CONTAINERS" | jq -r ".[] | select(.Names[] | contains(\"$CONTAINER_NAME\")) | .Id")
        
        if [ -n "$CONTAINER_ID" ]; then
          echo "找到现有容器: $CONTAINER_ID"
          
          # 3. 停止并删除现有容器
          echo "=== 停止现有容器 ==="
          curl -s -X POST \
            -H "X-API-Key: $PORTAINER_TOKEN" \
            "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/containers/$CONTAINER_ID/stop"
          
          echo "=== 删除现有容器 ==="
          curl -s -X DELETE \
            -H "X-API-Key: $PORTAINER_TOKEN" \
            "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/containers/$CONTAINER_ID"
        else
          echo "未找到现有容器，将创建新容器"
        fi
        
        # 4. 拉取新镜像
        echo "=== 拉取新镜像 ==="
        PULL_URL="$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/images/create?fromImage=$(echo "$GITHUB_IMAGE" | sed 's/:/%3A/g' | sed 's|/|%2F|g')"
        echo "拉取 URL: $PULL_URL"
        
        PULL_RESPONSE=$(curl -s -X POST \
          -H "X-API-Key: $PORTAINER_TOKEN" \
          "$PULL_URL")
        echo "拉取响应: $PULL_RESPONSE"
        
        # 等待镜像拉取完成
        sleep 10
        
        # 5. 创建新容器
        echo "=== 创建新容器 ==="
        CREATE_RESPONSE=$(curl -s -X POST \
          -H "X-API-Key: $PORTAINER_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"Image\": \"$GITHUB_IMAGE\",
            \"name\": \"$CONTAINER_NAME\",
            \"HostConfig\": {
              \"RestartPolicy\": {\"Name\": \"always\"},
              \"NetworkMode\": \"openim-docker_openim\",
              \"PortBindings\": {
                \"10001/tcp\": [{\"HostPort\": \"10001\"}],
                \"10002/tcp\": [{\"HostPort\": \"10002\"}]
              },
              \"Binds\": [
                \"/home/ubuntu/openim-docker/config:/openim/config:ro\",
                \"/home/ubuntu/openim-docker/_output/logs:/openim/logs\"
              ]
            },
            \"Env\": [
              \"TZ=Asia/Shanghai\",
              \"MONGO_URI=mongodb://openIM:openIM123@mongo:27017/openim_v3?maxPoolSize=100\",
              \"REDIS_ADDRESS=redis:6379\",
              \"REDIS_PASSWORD=openIM123\",
              \"KAFKA_ADDRESS=kafka:9092\",
              \"MINIO_ENDPOINT=http://minio:9000\",
              \"MINIO_ACCESS_KEY=root\",
              \"MINIO_SECRET_KEY=openIM123\",
              \"OPENIM_SECRET=openIM123\"
            ]
          }" \
          "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/containers/create")
        
        NEW_CONTAINER_ID=$(echo "$CREATE_RESPONSE" | jq -r '.Id')
        echo "新容器 ID: $NEW_CONTAINER_ID"
        
        # 6. 启动新容器
        echo "=== 启动新容器 ==="
        curl -s -X POST \
          -H "X-API-Key: $PORTAINER_TOKEN" \
          "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/containers/$NEW_CONTAINER_ID/start"
        
        # 7. 等待容器启动
        echo "=== 等待容器启动 ==="
        sleep 15
        
        # 8. 健康检查
        echo "=== 健康检查 ==="
        for i in {1..30}; do
          if curl -f http://129.226.214.22:10002/api/get_server_api_map &>/dev/null; then
            echo "✅ OpenIM Server 启动成功"
            
            # 发送部署成功通知到 Discord
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"embeds\": [{
                  \"title\": \"🎉 OpenIM Server - 部署成功 (Portainer API)\",
                  \"description\": \"通过 Portainer API 部署完成，服务正常运行\",
                  \"color\": 3066993,
                  \"fields\": [
                    {\"name\": \"分支\", \"value\": \"$BRANCH_NAME\", \"inline\": true},
                    {\"name\": \"提交哈希\", \"value\": \"${COMMIT_HASH:0:7}\", \"inline\": true},
                    {\"name\": \"运行镜像\", \"value\": \"$GITHUB_IMAGE\", \"inline\": false},
                    {\"name\": \"部署方式\", \"value\": \"Portainer API\", \"inline\": true}
                  ]
                }]
              }" &>/dev/null || echo "⚠️  Discord 通知发送失败"
            
            exit 0
          fi
          
          if [ $i -eq 30 ]; then
            echo "❌ 健康检查失败"
            
            # 发送部署失败通知到 Discord
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"embeds\": [{
                  \"title\": \"❌ OpenIM Server - 部署失败 (Portainer API)\",
                  \"description\": \"健康检查超时，服务启动失败\",
                  \"color\": 15158332,
                  \"fields\": [
                    {\"name\": \"分支\", \"value\": \"$BRANCH_NAME\", \"inline\": true},
                    {\"name\": \"提交哈希\", \"value\": \"${COMMIT_HASH:0:7}\", \"inline\": true},
                    {\"name\": \"镜像\", \"value\": \"$GITHUB_IMAGE\", \"inline\": false}
                  ]
                }]
              }" &>/dev/null || echo "⚠️  Discord 通知发送失败"
            
            exit 1
          fi
          
          echo "等待服务启动... ($i/30)"
          sleep 2
        done

    - name: Notify Discord - Build Failed
      if: failure()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"❌ OpenIM Server - 构建失败\",
              \"description\": \"Docker 镜像构建过程中出现错误\",
              \"color\": 15158332,
              \"fields\": [
                {
                  \"name\": \"分支\",
                  \"value\": \"\`${{ github.ref_name }}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"提交\",
                  \"value\": \"\`${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"构建者\",
                  \"value\": \"${{ github.actor }}\",
                  \"inline\": true
                }
              ]
            }]
          }"