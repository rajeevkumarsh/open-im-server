name: Build and Deploy OpenIM Server

on:
  push:
    branches: [ develop_build, main ]
  pull_request:
    branches: [ develop_build, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Notify Discord - Build Success
      if: success()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"🚀 OpenIM Server - 构建成功\",
              \"description\": \"Docker 镜像构建并推送完成\",
              \"color\": 3066993,
              \"fields\": [
                {
                  \"name\": \"分支\",
                  \"value\": \"\`${{ github.ref_name }}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"提交\",
                  \"value\": \"\`${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"镜像\",
                  \"value\": \"\`ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"构建者\",
                  \"value\": \"${{ github.actor }}\",
                  \"inline\": true
                }
              ]
            }]
          }"

    - name: Deploy to server via SSH
      if: github.ref == 'refs/heads/develop_build'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          # 进入项目目录
          cd ${{ secrets.DEPLOY_PATH || '/home/ubuntu/open-im-server' }}
          
          # 更新代码到最新版本
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          
          # 运行部署脚本
          chmod +x deploy.sh
          ./deploy.sh
          
          echo "部署完成: ${{ github.sha }}"

    - name: Notify Discord - Build Failed
      if: failure()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"❌ OpenIM Server - 构建失败\",
              \"description\": \"Docker 镜像构建过程中出现错误\",
              \"color\": 15158332,
              \"fields\": [
                {
                  \"name\": \"分支\",
                  \"value\": \"\`${{ github.ref_name }}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"提交\",
                  \"value\": \"\`${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"构建者\",
                  \"value\": \"${{ github.actor }}\",
                  \"inline\": true
                }
              ]
            }]
          }"