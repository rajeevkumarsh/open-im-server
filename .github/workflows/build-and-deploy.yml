name: Build and Deploy OpenIM Server

on:
  push:
    branches: [ develop_build, main ]
  pull_request:
    branches: [ develop_build, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Notify Discord - Build Success
      if: success()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"🚀 OpenIM Server - 构建成功\",
              \"description\": \"Docker 镜像构建并推送完成\",
              \"color\": 3066993,
              \"fields\": [
                {
                  \"name\": \"分支\",
                  \"value\": \"\`${{ github.ref_name }}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"提交\",
                  \"value\": \"\`${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"镜像\",
                  \"value\": \"\`ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"构建者\",
                  \"value\": \"${{ github.actor }}\",
                  \"inline\": true
                }
              ]
            }]
          }"

    - name: Debug SSH connection info
      if: github.ref == 'refs/heads/develop_build'
      run: |
        echo "=== SSH 连接信息调试 ==="
        echo "HOST: ${{ secrets.HOST }}"
        echo "USERNAME: ${{ secrets.USERNAME }}"
        echo "PORT: ${{ secrets.PORT || 22 }}"
        echo "DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/ubuntu/open-im-server' }}"
        echo "认证方式: 密码登录"

    - name: Deploy to server via SSH
      if: github.ref == 'refs/heads/develop_build'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.PORT || 22 }}
        timeout: 60s
        command_timeout: 300s
        debug: true
        script: |
          echo "=== SSH 连接成功 ==="
          whoami
          pwd
          echo "当前时间: $(date)"
          
          # 检查项目目录
          PROJECT_DIR="${{ secrets.DEPLOY_PATH || '/home/ubuntu/open-im-server' }}"
          echo "项目目录: $PROJECT_DIR"
          
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "❌ 项目目录不存在: $PROJECT_DIR"
            echo "当前目录内容:"
            ls -la
            exit 1
          fi
          
          # 进入项目目录
          cd "$PROJECT_DIR"
          echo "✅ 成功进入项目目录"
          
          # 检查 Git 状态
          echo "=== Git 状态检查 ==="
          git status --porcelain
          git branch -a
          git remote -v
          
          # 更新代码到最新版本
          echo "=== 更新代码 ==="
          git fetch origin --prune
          echo "当前分支: $(git branch --show-current)"
          echo "目标分支: ${{ github.ref_name }}"
          
          git reset --hard origin/${{ github.ref_name }}
          echo "代码更新完成"
          
          # 检查部署脚本
          echo "=== 检查部署脚本 ==="
          if [ ! -f "deploy.sh" ]; then
            echo "❌ deploy.sh 文件不存在"
            ls -la
            exit 1
          fi
          
          # 运行部署脚本
          echo "=== 运行部署脚本 ==="
          chmod +x deploy.sh
          ./deploy.sh
          
          echo "✅ 部署完成: ${{ github.sha }}"

    - name: Notify Discord - Build Failed
      if: failure()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"❌ OpenIM Server - 构建失败\",
              \"description\": \"Docker 镜像构建过程中出现错误\",
              \"color\": 15158332,
              \"fields\": [
                {
                  \"name\": \"分支\",
                  \"value\": \"\`${{ github.ref_name }}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"提交\",
                  \"value\": \"\`${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"构建者\",
                  \"value\": \"${{ github.actor }}\",
                  \"inline\": true
                }
              ]
            }]
          }"