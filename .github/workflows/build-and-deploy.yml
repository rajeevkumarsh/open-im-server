name: Build and Deploy OpenIM Server

on:
  push:
    branches: [ develop_build, main ]
  pull_request:
    branches: [ develop_build, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Notify Discord - Build Success
      if: success()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"🚀 OpenIM Server - 构建成功\",
              \"description\": \"Docker 镜像构建并推送完成\",
              \"color\": 3066993,
              \"fields\": [
                {
                  \"name\": \"分支\",
                  \"value\": \"\`${{ github.ref_name }}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"提交\",
                  \"value\": \"\`${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"镜像\",
                  \"value\": \"\`ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"构建者\",
                  \"value\": \"${{ github.actor }}\",
                  \"inline\": true
                }
              ]
            }]
          }"

    - name: Debug SSH connection info
      if: github.ref == 'refs/heads/develop_build'
      run: |
        echo "=== SSH 连接信息调试 ==="
        echo "HOST: ${{ secrets.HOST }}"
        echo "USERNAME: ${{ secrets.USERNAME }}"
        echo "PORT: ${{ secrets.PORT || 22 }}"
        echo "DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/ubuntu/open-im-server' }}"
        echo "认证方式: 密码登录"

    - name: Setup SSH and deploy
      if: github.ref == 'refs/heads/develop_build'
      run: |
        # 安装 sshpass
        sudo apt-get update && sudo apt-get install -y sshpass
        
        # 使用 sshpass 连接并执行部署
        sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -p ${{ secrets.PORT || 22 }} \
          ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
          'bash -s' <<'EOF'
          echo "=== SSH 连接成功 ==="
          whoami
          echo "当前时间: $(date)"
          
          # 设置变量
          CONTAINER_NAME="openim-server"
          COMMIT_HASH="${{ github.sha }}"
          BRANCH_NAME="${{ github.ref_name }}"
          GITHUB_IMAGE="ghcr.io/${{ github.repository }}:${BRANCH_NAME}-${COMMIT_HASH}"
          DISCORD_WEBHOOK_URL="https://discord.com/api/webhooks/1410921882714116227/M4NJjctluETrJk5JnWwW8U0uWCcgO_MYSCy-w8QefRI56zmMkY3Ii5C47MegO4A_1Vjm"
          
          echo "=== 部署信息 ==="
          echo "容器名称: $CONTAINER_NAME"
          echo "提交哈希: ${COMMIT_HASH:0:7}"
          echo "分支名称: $BRANCH_NAME" 
          echo "镜像地址: $GITHUB_IMAGE"
          
          # 1. 拉取最新镜像
          echo "=== 拉取最新镜像 ==="
          docker pull "$GITHUB_IMAGE"
          
          # 2. 停止并删除旧容器
          echo "=== 停止旧容器 ==="
          docker stop "$CONTAINER_NAME" 2>/dev/null || echo "容器未运行"
          docker rm "$CONTAINER_NAME" 2>/dev/null || echo "容器不存在"
          
          # 3. 启动新容器（写死所有配置）
          echo "=== 启动新容器 ==="
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart=always \
            --init \
            --network openim-docker_openim \
            -p 10001:10001 \
            -p 10002:10002 \
            -v /home/ubuntu/openim-docker/config:/openim/config:ro \
            -v /home/ubuntu/openim-docker/_output/logs:/openim/logs \
            -e TZ=Asia/Shanghai \
            -e MONGO_URI="mongodb://openIM:openIM123@mongo:27017/openim_v3?maxPoolSize=100" \
            -e REDIS_ADDRESS="redis:6379" \
            -e REDIS_PASSWORD="openIM123" \
            -e KAFKA_ADDRESS="kafka:9092" \
            -e MINIO_ENDPOINT="http://minio:9000" \
            -e MINIO_ACCESS_KEY="root" \
            -e MINIO_SECRET_KEY="openIM123" \
            -e OPENIM_SECRET="openIM123" \
            "$GITHUB_IMAGE"
          
          # 5. 等待容器启动
          echo "=== 等待容器启动 ==="
          sleep 15
          
          # 6. 健康检查
          echo "=== 健康检查 ==="
          for i in {1..30}; do
              if curl -f http://localhost:10002/api/get_server_api_map &>/dev/null; then
                  echo "✅ OpenIM Server 启动成功"
                  
                  # 发送部署成功通知到 Discord
                  curl -X POST "$DISCORD_WEBHOOK_URL" \
                      -H "Content-Type: application/json" \
                      -d "{
                          \"embeds\": [{
                              \"title\": \"🎉 OpenIM Server - 部署成功\",
                              \"description\": \"容器替换部署完成，服务正常运行\",
                              \"color\": 3066993,
                              \"fields\": [
                                  {
                                      \"name\": \"分支\",
                                      \"value\": \"$BRANCH_NAME\",
                                      \"inline\": true
                                  },
                                  {
                                      \"name\": \"提交哈希\",
                                      \"value\": \"${COMMIT_HASH:0:7}\",
                                      \"inline\": true
                                  },
                                  {
                                      \"name\": \"运行镜像\",
                                      \"value\": \"$GITHUB_IMAGE\",
                                      \"inline\": false
                                  },
                                  {
                                      \"name\": \"API 地址\",
                                      \"value\": \"http://localhost:10002\",
                                      \"inline\": true
                                  },
                                  {
                                      \"name\": \"部署时间\",
                                      \"value\": \"$(date)\",
                                      \"inline\": false
                                  }
                              ]
                          }]
                      }" &>/dev/null || echo "⚠️  Discord 通知发送失败"
                  
                  break
              fi
              
              if [ $i -eq 30 ]; then
                  echo "❌ 健康检查失败"
                  echo "=== 容器状态 ==="
                  docker ps -f name="$CONTAINER_NAME"
                  echo "=== 容器日志 ==="
                  docker logs --tail=20 "$CONTAINER_NAME"
                  
                  # 发送部署失败通知到 Discord
                  curl -X POST "$DISCORD_WEBHOOK_URL" \
                      -H "Content-Type: application/json" \
                      -d "{
                          \"embeds\": [{
                              \"title\": \"❌ OpenIM Server - 部署失败\",
                              \"description\": \"健康检查超时，服务启动失败\",
                              \"color\": 15158332,
                              \"fields\": [
                                  {
                                      \"name\": \"分支\",
                                      \"value\": \"$BRANCH_NAME\",
                                      \"inline\": true
                                  },
                                  {
                                      \"name\": \"提交哈希\",
                                      \"value\": \"${COMMIT_HASH:0:7}\",
                                      \"inline\": true
                                  },
                                  {
                                      \"name\": \"镜像\",
                                      \"value\": \"$GITHUB_IMAGE\",
                                      \"inline\": false
                                  },
                                  {
                                      \"name\": \"失败时间\",
                                      \"value\": \"$(date)\",
                                      \"inline\": true
                                  }
                              ]
                          }]
                      }" &>/dev/null || echo "⚠️  Discord 通知发送失败"
                      
                  exit 1
              fi
              
              echo "等待服务启动... ($i/30)"
              sleep 2
          done
          
          # 7. 显示部署结果
          echo "=== 部署成功 ==="
          echo "✅ OpenIM Server 容器替换完成"
          echo "提交哈希: ${COMMIT_HASH:0:7}"
          echo "运行镜像: $GITHUB_IMAGE"
          echo "API 地址: http://localhost:10002"
          
          # 显示容器状态
          echo "=== 容器状态 ==="
          docker ps -f name="$CONTAINER_NAME"
          
          echo "🎉 部署完成！"
        EOF

    - name: Notify Discord - Build Failed
      if: failure()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"❌ OpenIM Server - 构建失败\",
              \"description\": \"Docker 镜像构建过程中出现错误\",
              \"color\": 15158332,
              \"fields\": [
                {
                  \"name\": \"分支\",
                  \"value\": \"\`${{ github.ref_name }}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"提交\",
                  \"value\": \"\`${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"构建者\",
                  \"value\": \"${{ github.actor }}\",
                  \"inline\": true
                }
              ]
            }]
          }"