name: Build and Deploy OpenIM Server

on:
  push:
    branches: [ develop_build, main ]
  pull_request:
    branches: [ develop_build, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-,format=short
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Notify Discord - Build Success
      if: success()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"🚀 OpenIM Server - 构建成功\",
              \"description\": \"Docker 镜像构建并推送完成\",
              \"color\": 3066993,
              \"fields\": [
                {
                  \"name\": \"分支\",
                  \"value\": \"\`${{ github.ref_name }}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"提交\",
                  \"value\": \"\`${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"镜像\",
                  \"value\": \"\`ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"构建者\",
                  \"value\": \"${{ github.actor }}\",
                  \"inline\": true
                }
              ]
            }]
          }"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop_build'

    steps:

    - name: Deploy via 1Panel API
      if: github.ref == 'refs/heads/develop_build'
      run: |
        # 设置变量
        PANEL_URL="http://124.156.102.70:18238"
        API_KEY="MdRXfn1dhUkQ3vMUUqILrDKECAELkoUD"
        TIMESTAMP=$(date +%s)
        CONTAINER_NAME="openim-server"
        COMMIT_HASH="${{ github.sha }}"
        BRANCH_NAME="${{ github.ref_name }}"
        GITHUB_IMAGE="ghcr.io/${{ github.repository }}:${BRANCH_NAME}-${COMMIT_HASH:0:7}"
        DISCORD_WEBHOOK_URL="https://discord.com/api/webhooks/1410921882714116227/M4NJjctluETrJk5JnWwW8U0uWCcgO_MYSCy-w8QefRI56zmMkY3Ii5C47MegO4A_1Vjm"
        
        echo "=== 1Panel API 部署 ==="
        echo "面板地址: $PANEL_URL"
        echo "容器名称: $CONTAINER_NAME"
        echo "新镜像: $GITHUB_IMAGE"
        
        # 1. 停止现有容器
        echo "=== 停止现有容器 ==="
        curl -s -X POST \
          -H "X-API-Key: $API_KEY" \
          -H "Timestamp: $TIMESTAMP" \
          -H "Content-Type: application/json" \
          -d "{
            \"names\": [\"$CONTAINER_NAME\"],
            \"operation\": \"stop\"
          }" \
          "$PANEL_URL/api/v2/containers/operate" || echo "容器可能不存在或已停止"
        
        # 2. 删除现有容器
        echo "=== 删除现有容器 ==="
        curl -s -X POST \
          -H "X-API-Key: $API_KEY" \
          -H "Timestamp: $TIMESTAMP" \
          -H "Content-Type: application/json" \
          -d "{
            \"names\": [\"$CONTAINER_NAME\"],
            \"operation\": \"remove\"
          }" \
          "$PANEL_URL/api/v2/containers/operate" || echo "容器可能不存在"
        
        # 3. 拉取新镜像
        echo "=== 拉取镜像 ==="
        PULL_RESPONSE=$(curl -s -X POST \
          -H "X-API-Key: $API_KEY" \
          -H "Timestamp: $TIMESTAMP" \
          -H "Content-Type: application/json" \
          -d "{
            \"imageName\": \"$GITHUB_IMAGE\"
          }" \
          "$PANEL_URL/api/v2/containers/image/pull")
        echo "拉取结果: $PULL_RESPONSE"
        
        # 等待镜像拉取完成
        sleep 10
        
        # 4. 创建新容器
        echo "=== 创建新容器 ==="
        CREATE_RESPONSE=$(curl -s -X POST \
          -H "X-API-Key: $API_KEY" \
          -H "Timestamp: $TIMESTAMP" \
          -H "Content-Type: application/json" \
          -d "{
            \"name\": \"$CONTAINER_NAME\",
            \"image\": \"$GITHUB_IMAGE\",
            \"restartPolicy\": \"always\",
            \"network\": \"openim-docker_openim\",
            \"exposedPorts\": [
              {\"hostPort\": \"10001\", \"containerPort\": \"10001\", \"protocol\": \"tcp\"},
              {\"hostPort\": \"10002\", \"containerPort\": \"10002\", \"protocol\": \"tcp\"}
            ],
            \"volumes\": [
              {\"sourceDir\": \"/home/ubuntu/openim-docker/config\", \"containerDir\": \"/openim/config\", \"mode\": \"ro\", \"type\": \"bind\"},
              {\"sourceDir\": \"/home/ubuntu/openim-docker/_output/logs\", \"containerDir\": \"/openim/logs\", \"mode\": \"rw\", \"type\": \"bind\"}
            ],
            \"env\": [
              \"TZ=Asia/Shanghai\",
              \"MONGO_URI=mongodb://openIM:openIM123@mongo:27017/openim_v3?maxPoolSize=100\",
              \"REDIS_ADDRESS=redis:6379\",
              \"REDIS_PASSWORD=openIM123\",
              \"KAFKA_ADDRESS=kafka:9092\",
              \"MINIO_ENDPOINT=http://minio:9000\",
              \"MINIO_ACCESS_KEY=root\",
              \"MINIO_SECRET_KEY=openIM123\",
              \"OPENIM_SECRET=openIM123\"
            ]
          }" \
          "$PANEL_URL/api/v2/containers")
        
        echo "创建结果: $CREATE_RESPONSE"
        
        # 5. 启动容器
        echo "=== 启动容器 ==="
        curl -s -X POST \
          -H "X-API-Key: $API_KEY" \
          -H "Timestamp: $TIMESTAMP" \
          -H "Content-Type: application/json" \
          -d "{
            \"names\": [\"$CONTAINER_NAME\"],
            \"operation\": \"start\"
          }" \
          "$PANEL_URL/api/v2/containers/operate"
        
        # 6. 等待容器启动
        echo "=== 等待容器启动 ==="
        sleep 15
        
        # 7. 健康检查
        echo "=== 健康检查 ==="
        for i in {1..30}; do
          if curl -f http://124.156.102.70:10002/api/get_server_api_map &>/dev/null; then
            echo "✅ OpenIM Server 启动成功"
            
            # 发送部署成功通知到 Discord
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"embeds\": [{
                  \"title\": \"🎉 OpenIM Server - 部署成功 (1Panel API)\",
                  \"description\": \"通过1Panel API部署完成，服务正常运行\",
                  \"color\": 3066993,
                  \"fields\": [
                    {\"name\": \"分支\", \"value\": \"$BRANCH_NAME\", \"inline\": true},
                    {\"name\": \"提交哈希\", \"value\": \"${COMMIT_HASH:0:7}\", \"inline\": true},
                    {\"name\": \"运行镜像\", \"value\": \"$GITHUB_IMAGE\", \"inline\": false},
                    {\"name\": \"部署方式\", \"value\": \"1Panel API\", \"inline\": true}
                  ]
                }]
              }" &>/dev/null || echo "⚠️ Discord 通知发送失败"
            
            exit 0
          fi
          
          if [ $i -eq 30 ]; then
            echo "❌ 健康检查失败"
            
            # 发送部署失败通知到 Discord
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"embeds\": [{
                  \"title\": \"❌ OpenIM Server - 部署失败 (1Panel API)\",
                  \"description\": \"健康检查超时，服务启动失败\",
                  \"color\": 15158332,
                  \"fields\": [
                    {\"name\": \"分支\", \"value\": \"$BRANCH_NAME\", \"inline\": true},
                    {\"name\": \"提交哈希\", \"value\": \"${COMMIT_HASH:0:7}\", \"inline\": true},
                    {\"name\": \"镜像\", \"value\": \"$GITHUB_IMAGE\", \"inline\": false}
                  ]
                }]
              }" &>/dev/null || echo "⚠️ Discord 通知发送失败"
            
            exit 1
          fi
          
          echo "等待服务启动... ($i/30)"
          sleep 2
        done

    - name: Notify Discord - Build Failed
      if: failure()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"❌ OpenIM Server - 构建失败\",
              \"description\": \"Docker 镜像构建过程中出现错误\",
              \"color\": 15158332,
              \"fields\": [
                {
                  \"name\": \"分支\",
                  \"value\": \"\`${{ github.ref_name }}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"提交\",
                  \"value\": \"\`${{ github.sha }}\`\",
                  \"inline\": false
                },
                {
                  \"name\": \"构建者\",
                  \"value\": \"${{ github.actor }}\",
                  \"inline\": true
                }
              ]
            }]
          }"